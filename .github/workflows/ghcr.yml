name: Publish GHCR image

on:
  push:
    branches: [customizations]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'digitalbase/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout management UI
        uses: actions/checkout@v4
        with:
          repository: digitalbase/Cli-Proxy-API-Management-Center
          ref: 501e2f7ca16bae50ba0175551b0a1c3078903ec1
          path: management-ui

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build management UI
        working-directory: management-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Include management UI
        run: |
          mkdir -p static
          cp management-ui/dist/index.html static/management.html

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/digitalbase/cliproxyapi
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/customizations' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.timestamp.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published management UI
        run: |
          image="ghcr.io/digitalbase/cliproxyapi:sha-${GITHUB_SHA}"
          docker pull "$image"
          cat > /tmp/verify-config.yaml <<'EOF'
          port: 8317
          api-keys: ["ci-smoke-test-key"]
          remote-management:
            allow-remote: true
            secret-key: "ci-smoke-test-management"
          EOF
          docker run -d --name verify-ui -p 18317:8317 \
            -v /tmp/verify-config.yaml:/CLIProxyAPI/config.yaml \
            "$image"
          trap 'docker logs verify-ui; docker rm -f verify-ui' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:18317/management.html -o /tmp/served-management.html; then
              break
            fi
            sleep 1
          done
          cmp management-ui/dist/index.html /tmp/served-management.html
          test "$(docker exec verify-ui printenv MANAGEMENT_DISABLE_AUTO_UPDATE)" = true
