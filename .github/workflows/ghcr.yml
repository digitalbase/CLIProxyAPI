name: Publish GHCR image

on:
  push:
    branches: [customizations]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'digitalbase/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout management UI
        uses: actions/checkout@v4
        with:
          repository: digitalbase/Cli-Proxy-API-Management-Center
          ref: 47828843172e539a95351e6984cf58fef62010c3
          path: management-ui

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build management UI
        working-directory: management-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Include management UI
        run: |
          mkdir -p static
          cp management-ui/dist/index.html static/management.html

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/digitalbase/cliproxyapi
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/customizations' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.timestamp.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
